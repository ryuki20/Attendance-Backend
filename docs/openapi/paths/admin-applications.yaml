get:
  summary: 申請一覧取得（管理者）
  description: |
    全社員の申請一覧を取得します。

    **このエンドポイントはadminロールの社員のみ実行できます。**
  operationId: getAdminApplications
  tags:
    - admin
  security:
    - bearerAuth: []
  parameters:
    - name: status
      in: query
      description: ステータスでフィルタリング
      required: false
      schema:
        type: string
        enum: [PENDING, APPROVED, REJECTED]
        example: PENDING
    - name: page
      in: query
      description: ページ番号（1始まり）
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    - name: per_page
      in: query
      description: 1ページあたりの件数
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
  responses:
    '200':
      description: 申請一覧取得成功
      content:
        application/json:
          schema:
            type: object
            properties:
              applications:
                type: array
                items:
                  oneOf:
                    - $ref: '../schemas/AttendanceCorrectionApplication.yaml'
                  discriminator:
                    propertyName: type
                    mapping:
                      ATTENDANCE_CORRECTION: '../schemas/AttendanceCorrectionApplication.yaml'
              total:
                type: integer
                description: 全件数
                example: 42
              page:
                type: integer
                description: 現在のページ番号
                example: 1
              per_page:
                type: integer
                description: 1ページあたりの件数
                example: 20
    '400':
      description: パラメータエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/Error.yaml'
          example:
            error: invalid status value
    '401':
      $ref: '../responses/UnauthorizedError.yaml'
    '403':
      $ref: '../responses/ForbiddenError.yaml'
    '500':
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '../schemas/Error.yaml'
          example:
            error: internal server error
